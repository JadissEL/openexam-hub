name: Feature request
description: A specific improvement to the planner, library or docs.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is this for, and what is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: A concrete proposal is more useful than a vague wish. Official-source constraints still apply.
    validations:
      required: true
  - type: markdown
    attributes:
      value: Please do not propose paywalled content, unofficial dumps, or fabricated testimonials or statistics.
