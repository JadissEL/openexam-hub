apply plugin: 'com.android.application'

def admobProps = new Properties()
def admobFile = rootProject.file("admob.properties")
if (admobFile.exists()) {
    admobFile.withInputStream { admobProps.load(it) }
}
def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

def configValue = { String envName, String fileKey, String fallback ->
    def fromEnv = System.getenv(envName)
    if (fromEnv != null && fromEnv.trim()) return fromEnv.trim()
    def fromFile = admobProps.getProperty(fileKey)
    if (fromFile != null && fromFile.trim()) return fromFile.trim()
    if (project.hasProperty(fileKey) && String.valueOf(project.property(fileKey)).trim()) {
        return String.valueOf(project.property(fileKey)).trim()
    }
    return fallback
}

def sampleAppId = "ca-app-pub-3940256099942544~3347511713"
def rawAppId = configValue("ADMOB_APP_ID", "ADMOB_APP_ID", "")
def rawBanner = configValue("ADMOB_BANNER_UNIT_ID", "ADMOB_BANNER_UNIT_ID", "")
def clarityId = configValue("CLARITY_PROJECT_ID", "CLARITY_PROJECT_ID", "zk5viik44t")
def umpDebug = configValue("UMP_DEBUG_EEA", "UMP_DEBUG_EEA", "false").equalsIgnoreCase("true")
def placeholderId = { String value ->
    if (value == null || !value.trim()) return true
    def id = value.trim()
    return id.contains("XXXX") || id.contains("YYYY") || id.contains("ZZZZ") || id.contains("3940256099942544")
}
def adsConfigured = !placeholderId(rawAppId) && !placeholderId(rawBanner)
def manifestAppId = placeholderId(rawAppId) ? sampleAppId : rawAppId
def gradleQuote = { String value -> '"' + value.replace("\\", "\\\\").replace("\"", "\\\"") + '"' }

def uploadStore = System.getenv("OEH_UPLOAD_STORE_FILE") ?: keystoreProps.getProperty("storeFile")
def uploadStorePassword = System.getenv("OEH_UPLOAD_STORE_PASSWORD") ?: keystoreProps.getProperty("storePassword")
def uploadAlias = System.getenv("OEH_UPLOAD_KEY_ALIAS") ?: keystoreProps.getProperty("keyAlias")
def uploadKeyPassword = System.getenv("OEH_UPLOAD_KEY_PASSWORD") ?: keystoreProps.getProperty("keyPassword")

android {
    namespace = "org.openexamhub.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.openexamhub.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [admobAppId: manifestAppId]
        buildConfigField "String", "ADMOB_BANNER_UNIT_ID", gradleQuote(rawBanner)
        buildConfigField "boolean", "ADS_CONFIGURED", adsConfigured ? "true" : "false"
        buildConfigField "String", "CLARITY_PROJECT_ID", gradleQuote(clarityId)
        buildConfigField "boolean", "UMP_DEBUG_EEA", umpDebug ? "true" : "false"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    signingConfigs {
        release {
            if (uploadStore) {
                storeFile file(uploadStore)
                storePassword uploadStorePassword
                keyAlias uploadAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            // Debug installs always declare Google's sample app id, so they never hit a production ad unit.
            manifestPlaceholders = [admobAppId: sampleAppId]
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (uploadStore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation platform("com.google.firebase:firebase-bom:35.2.0")
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.android.gms:play-services-ads:25.5.0"
    implementation "com.google.android.ump:user-messaging-platform:4.0.0"
    implementation "com.google.android.gms:play-services-auth:21.5.1"
    implementation "com.microsoft.clarity:clarity:3.3.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
